<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Регистрация в системе</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/assets/css/common.css" />
		<link rel="stylesheet" href="/assets/css/login.css" />
	</head>
	<body>
		<div class="loginPage">
			<div class="toastContainer" id="toastContainer"></div>
			<div class="decoration"></div>
			<div class="decoration"></div>
			<div class="decoration"></div>

			<div class="container">
				<div class="content">
					<div class="logo">
						<i class="bi bi-door-open"></i>
					</div>
					<h1>Регистрация в системе</h1>
					<p class="subtitle">
						Заявок на ремонт <span class="systemname">общежития</span><br />
						Создайте аккаунт в системе
					</p>
					<form class="loginForm" id="registerForm">
						<div class="formGroup">
							<div class="inputWrapper">
								<i class="bi bi-person"></i>
								<input
									type="text"
									class="formControl"
									id="regUsername"
									placeholder="Придумайте логин"
									autocomplete="username"
								/>
							</div>
							<div class="errorMessageInline" id="regUsernameError"></div>
						</div>

						<div class="formGroup">
							<div class="inputWrapper">
								<i class="bi bi-person-badge"></i>
								<input
									type="text"
									class="formControl"
									id="regFio"
									placeholder="ФИО (например, Иванов Иван Иванович)"
									autocomplete="name"
								/>
							</div>
							<div class="errorMessageInline" id="regFioError"></div>
						</div>

						<div class="formGroup">
							<div class="inputWrapper">
								<i class="bi bi-lock"></i>
								<input
									type="password"
									class="formControl"
									id="regPassword"
									placeholder="Придумайте пароль"
									autocomplete="new-password"
								/>
								<button
									type="button"
									class="passwordToggleBtn"
									id="toggleRegPassword"
									aria-label="Показать пароль"
								>
									<i class="bi bi-eye" id="regPasswordIcon"></i>
								</button>
							</div>
							<div class="errorMessageInline" id="regPasswordError"></div>
						</div>

						<div class="formGroup">
							<div class="inputWrapper">
								<i class="bi bi-lock-fill"></i>
								<input
									type="password"
									class="formControl"
									id="regConfirmPassword"
									placeholder="Повторите пароль"
									autocomplete="new-password"
								/>
								<button
									type="button"
									class="passwordToggleBtn"
									id="toggleConfirmPassword"
									aria-label="Показать пароль"
								>
									<i class="bi bi-eye" id="confirmPasswordIcon"></i>
								</button>
							</div>
							<div
								class="errorMessageInline"
								id="regConfirmPasswordError"
							></div>
						</div>

						<button type="submit" class="btn btnPrimary" id="registerBtn">
							<span
								class="spinner"
								id="regSpinner"
								style="display: none"
							></span>
							<i
								class="bi bi-person-plus me-2 registerIcon"
								id="registerIcon"
							></i>
							Зарегистрироваться
						</button>

						<button
							type="button"
							class="btn btnSecondary"
							id="showLoginBtn"
							style="margin-top: 1rem"
						>
							Уже есть аккаунт? Войти
						</button>
					</form>
				</div>
			</div>
		</div>

		<script src="/assets/js/api.js"></script>
		<script src="/assets/js/auth.js"></script>
		<script src="/assets/js/pages/registration.js"></script>
	</body>
</html>
