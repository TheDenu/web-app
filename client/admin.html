<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<title>Панель админа — Общежитие</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/assets/css/common.css" />
		<link rel="stylesheet" href="/assets/css/dashboard.css" />
		<link rel="stylesheet" href="/assets/css/admin.css" />
	</head>
	<body>
		<div class="dashboardPage">
			<aside class="sidebar">
				<div class="sidebarHeader">
					<div class="logo">
						<i class="bi bi-door-open"></i>
					</div>
					<div class="userInfo">
						<div id="userName" class="userName"></div>
						<div id="userRole" class="userRole"></div>
					</div>
				</div>
				<nav class="sidebarNav">
					<a href="dashboard.html" class="navItem">
						<i class="bi bi-list-ul"></i>
						<span>Мои заявки</span>
					</a>
					<a href="create.html" class="navItem">
						<i class="bi bi-plus-circle"></i>
						<span>Новая заявка</span>
					</a>
					<a href="#" data-view="admin" class="navItem active">
						<i class="bi bi-people"></i>
						<span>Панель админа</span>
					</a>
				</nav>
				<button class="logoutBtn navItem" id="logoutBtn">
					<i class="bi bi-box-arrow-right"></i>
					Выйти
				</button>
			</aside>

			<main class="mainContent">
				<header class="pageHeader">
					<div class="headerLeft">
						<h1>Все заявки</h1>
						<!-- СТАТИСТИКА СТАТУСОВ -->
						<div class="statsRow" id="statsRow"></div>
					</div>

					<div class="headerCenter">
						<div class="searchContainer">
							<i class="bi bi-search searchIcon"></i>
							<input
								type="text"
								id="searchInput"
								class="searchInput"
								placeholder="Поиск по описанию, ФИО, комнате..."
							/>
						</div>
					</div>

					<div class="headerRight" >
						<select id="statusFilter" class="selectControl">
							<option value="">Все статусы</option>
						</select>
					</div>
				</header>

				<section class="contentSection">
					<div id="applicationsContainer" class="cardsGrid"></div>
					<div
						class="emptyState"
						id="emptyState"
						style="
							grid-column: 1/-1;
							text-align: center;
							padding: 4rem;
							color: #6b7280;
							display: none;
						"
					>
						<i class="bi bi-inbox" style="font-size: 3rem; opacity: 0.5"></i>
						<h3>Нет заявок</h3>
						<p>Заявок пока нет</p>
					</div>
					<div id="pagination" class="pagination">
						<button id="prevPageBtn" class="pageBtn" disabled>
							<i class="bi bi-chevron-left"></i>
						</button>
						<span id="paginationInfo" class="paginationInfo"
							>Страница 1 из 1</span
						>
						<button id="nextPageBtn" class="pageBtn" disabled>
							<i class="bi bi-chevron-right"></i>
						</button>
					</div>
				</section>
			</main>
		</div>

		<!-- МОДАЛКА С SELECT ДЛЯ СМЕНЫ СТАТУСА -->
		<div class="modalBackdrop" id="applicationModal" style="display: none">
			<div class="modalDialog">
				<div class="modalHeader">
					<div class="modalTitleRow">
						<span id="modalAppNumber" class="modalAppNumber">#0</span>
					</div>
					<!-- SELECT ДЛЯ СМЕНЫ СТАТУСА -->
					<select id="statusSelect" class="statusSelect selectControl">
						<!-- заполняется динамически -->
					</select>
					<button class="modalCloseBtn" id="modalCloseBtn" type="button">
						<i class="bi bi-x-lg"></i>
					</button>
				</div>
				<div id="modalPlace" class="modalPlace">Этаж, секция, комната</div>
				<div class="modalBody">
					<div class="modalMetaRow">
						<span class="metaItem">
							<i class="bi bi-calendar"></i>
							<span id="modalCreatedAt">—</span>
						</span>
						<span class="metaItem">
							<i class="bi bi-person"></i>
							<span id="modalUser">—</span>
						</span>
						<span class="metaItem">
							<i class="bi bi-bug"></i>
							<span id="modalDefectType">—</span>
						</span>
						<span class="metaItem">
							<i class="bi bi-arrow-up"></i>
							<span id="modalPriority">—</span>
						</span>
					</div>
					<div class="modalSection">
						<h3>Описание</h3>
						<p id="modalDescription">—</p>
					</div>
					<div class="modalSection">
						<h3>Фото</h3>
						<div id="modalPhotos" class="modalPhotos"></div>
					</div>
				</div>
			</div>
		</div>

		<div id="toastContainer" class="toastContainer"></div>

		<script src="/assets/js/api.js"></script>
		<script src="/assets/js/auth.js"></script>
		<script src="/assets/js/pages/admin.js"></script>
	</body>
</html>
