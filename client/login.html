<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<title>Вход в систему</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/assets/css/common.css" />
		<link rel="stylesheet" href="/assets/css/login.css" />
	</head>
	<body>
		<div class="loginPage">
			<div class="toastContainer" id="toastContainer"></div>
			<div class="decoration"></div>
			<div class="decoration"></div>
			<div class="decoration"></div>

			<div class="container">
				<div class="content">
					<div class="logo">
						<i class="bi bi-door-open"></i>
					</div>
					<h1>Вход в систему</h1>
					<p class="subtitle">
						Заявок на ремонт <span class="systemname">общежития</span><br />
						Войдите в систему для создания заявок
					</p>

					<form class="loginForm" id="loginForm">
						<div class="formGroup">
							<div class="inputWrapper">
								<i class="bi bi-person"></i>
								<input
									type="text"
									class="formControl"
									id="username"
									placeholder="Введите логин"
									autocomplete="username"
								/>
							</div>
							<div class="errorMessageInline" id="usernameError"></div>
						</div>

						<div class="formGroup">
							<div class="inputWrapper">
								<i class="bi bi-lock"></i>
								<input
									type="password"
									class="formControl"
									id="password"
									placeholder="Введите пароль"
									autocomplete="current-password"
								/>
								<button
									type="button"
									class="passwordToggleBtn"
									id="togglePassword"
									aria-label="Показать пароль"
								>
									<i class="bi bi-eye" id="passwordIcon"></i>
								</button>
							</div>
							<div class="errorMessageInline" id="passwordError"></div>
						</div>

						<button type="submit" class="btn btnPrimary" id="loginBtn">
							<span class="spinner" id="spinner" style="display: none"></span>
							<i
								class="bi bi-box-arrow-in-right me-2 loginIcon"
								id="loginIcon"
							></i>
							Войти
						</button>

						<!-- Кнопка для перехода к регистрации -->
						<button
							type="button"
							class="btn btnSecondary"
							id="showRegisterBtn"
							style="margin-top: 1rem"
						>
							Нет аккаунта? Зарегистрироваться
						</button>
					</form>
				</div>
			</div>
		</div>

		<script src="/assets/js/api.js"></script>
		<script src="/assets/js/auth.js"></script>
		<script src="/assets/js/pages/login.js"></script>
	</body>
</html>
