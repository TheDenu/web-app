<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест API - Создание заявки</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #007cba; color: white; padding: 12px 30px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #005a87; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #fileList { margin-top: 10px; }
        .file-item { padding: 5px; border: 1px solid #eee; margin: 5px 0; border-radius: 3px; background: #f9f9f9; }
        #response { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>🛠️ Тест создания заявки с фото</h1>
    
    <form id="applicationForm" enctype="multipart/form-data">
        <div class="form-group">
            <label for="place_id">Место (ID):</label>
            <select id="place_id" name="place_id" required>
                <option value="1">Этаж 1, комната 101, секция А</option>
                <option value="2">Этаж 1, комната 102, секция А</option>
                <option value="3">Этаж 2, комната 201, секция Б</option>
                <option value="4">Этаж 3, комната 301, секция А</option>
                <option value="5">Этаж 3, комната 302, секция Б</option>
            </select>
        </div>

        <div class="form-group">
            <label for="defect_type_id">Тип дефекта (ID):</label>
            <select id="defect_type_id" name="defect_type_id" required>
                <option value="1">Свет не работает</option>
                <option value="2">Вода не течет</option>
                <option value="3">Розетка не работает</option>
                <option value="4">Дверь не открывается</option>
                <option value="5">Окно не открывается</option>
                <option value="6">Пол сломан</option>
            </select>
        </div>

        <div class="form-group">
            <label for="priority_id">Приоритет (ID):</label>
            <select id="priority_id" name="priority_id" required>
                <option value="1">Низкий</option>
                <option value="2">Средний</option>
                <option value="3">Высокий</option>
                <option value="4">Критический</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Описание проблемы:</label>
            <textarea id="description" name="description" rows="4" required placeholder="Опишите проблему подробно..."></textarea>
        </div>

        <div class="form-group">
            <label for="photos">Фото (несколько файлов):</label>
            <input type="file" id="photos" name="photos[]" accept="image/*" multiple required>
            <div id="fileList"></div>
        </div>

        <button type="submit" id="submitBtn">📤 Создать заявку</button>
    </form>

    <div id="response"></div>

    <script>
        const form = document.getElementById('applicationForm');
        const fileInput = document.getElementById('photos');
        const fileList = document.getElementById('fileList');
        const submitBtn = document.getElementById('submitBtn');
        const responseDiv = document.getElementById('response');

        // Показываем выбранные файлы
        fileInput.addEventListener('change', function() {
            fileList.innerHTML = '';
            Array.from(this.files).forEach(file => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `📁 ${file.name} (${(file.size/1024).toFixed(1)} KB)`;
                fileList.appendChild(div);
            });
        });

        // Отправка формы
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Отправка...';

            const formData = new FormData(form);
            
            // ВАШ JWT ТОКЕН ЗДЕСЬ
            const token = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NjQ2NjI5ODYsImV4cCI6MTc2NDY2NjU4NiwiZGF0YSI6eyJ1c2VySWQiOjEsInJvbGUiOiJhZG1pbiJ9fQ.s1zafHVqni_dvtZzydDTmBG9qDlWpwelM0ZNbfNen8Y';

            try {
                const response = await fetch('http://127.0.0.1:8000/api/application/create', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    },
                    body: formData
                });

                const result = await response.json();
                
                if (response.ok) {
                    responseDiv.className = 'success';
                    responseDiv.innerHTML = `
                        <h3>✅ Успех!</h3>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                } else {
                    responseDiv.className = 'error';
                    responseDiv.innerHTML = `
                        <h3>❌ Ошибка ${response.status}</h3>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                responseDiv.className = 'error';
                responseDiv.innerHTML = `<h3>❌ Network Error: ${error.message}</h3>`;
            }

            submitBtn.disabled = false;
            submitBtn.textContent = '📤 Создать заявку';
        });
    </script>
</body>
</html>
